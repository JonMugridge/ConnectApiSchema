<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8">

<title>Credas Connect API schema (v2-ci)</title>
<style>
:root{--paper:#F6F6F7;--surface:#fff;--ink:#2B2C2F;--muted:#5A5B5F;--rule:#DCDCDF;--accent:#FBB205;--soft:#FEF1CC;--link:#8A5D00;--get:#0F6E56;--post:#3B4BB5;--put:#8A5D00;--del:#B42318;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1C1D20;--surface:#26272B;--ink:#ECECEE;--muted:#A6A7AD;--rule:#3A3B40;--soft:#3A2F12;--link:#FBC64A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1C1D20;--surface:#26272B;--ink:#ECECEE;--muted:#A6A7AD;--rule:#3A3B40;--soft:#3A2F12;--link:#FBC64A;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--accent);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header h1{font-size:17px;margin:0}header .meta{color:var(--muted);font-size:13px}
#q{margin-left:auto;font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);min-width:240px}
.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100% - 64px)}
nav{overflow:auto;border-right:1px solid var(--rule);padding:8px 10px 40px}
.tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 6px 4px}
.op{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:5px 6px;font:inherit;color:var(--ink);cursor:pointer}
.op:hover{background:var(--surface)}.op[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
.op code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.opt{display:flex;flex-direction:column;min-width:0}
.hit{font-size:11.5px;color:var(--link);margin-top:1px;overflow-wrap:anywhere}
.count{font-size:12.5px;color:var(--muted);margin:6px 6px 0}
.m{font:700 10.5px var(--mono);color:#fff;border-radius:4px;padding:1px 5px;flex:none;min-width:44px;text-align:center}
.GET{background:var(--get)}.POST{background:var(--post)}.PUT{background:var(--put)}.DELETE{background:var(--del)}.PATCH{background:var(--put)}
main{overflow:auto;padding:22px 28px 60px}
h2{font-size:20px;margin:0 0 4px}h3{font-size:14.5px;margin:22px 0 6px}
.path{font-family:var(--mono);font-size:13.5px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);border:1px solid var(--rule)}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}th{color:var(--muted);font-size:12px}
td code,.ref{font-family:var(--mono);font-size:12.5px}
.ref{color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-align:left;overflow-wrap:anywhere}
pre{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;overflow:auto;font:12.5px/1.45 var(--mono);max-height:60vh}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:8px}
button.tb{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
@media (hover:none) and (pointer:coarse){html,body{height:auto}.wrap{display:block;height:auto}nav{max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--rule)}main{overflow:visible}.back{display:inline-block}}
.back{display:none;font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px;margin-bottom:12px;cursor:pointer}
@media (max-width:860px){html,body{height:auto}.wrap{display:block;height:auto}nav{border-right:0;border-bottom:1px solid var(--rule);max-height:none;overflow:visible}main{overflow:visible}.back{display:inline-block}#q{min-width:0;width:100%;margin-left:0}}
</style></head><body>

function bodySchema(rb){if(!rb||!rb.content)return null;var c=rb.content['application/json']||rb.content[Object.keys(rb.content)[0]];return c&&c.schema||null;}
ops.forEach(function(x){var o=x.o,t=[];(o.parameters||[]).forEach(function(p){t.push({k:p.in==='path'?'path parameter':p.in==='query'?'query parameter':p.in+' parameter',n:p.name,d:p.description||''});});
 var bs=bodySchema(o.requestBody),bo=[];if(bs){propNames(bs,4,{},bo,'');bo.forEach(function(b){t.push({k:'request field',n:b.n,d:b.d});});}
 if(o.responses){var ro=[],seen={};Object.keys(o.responses).forEach(function(c){var rs=bodySchema(o.responses[c]);if(rs)propNames(rs,4,seen,ro,'');});ro.forEach(function(r){t.push({k:'response field',n:r.n,d:r.d});});}
 x.terms=t;x.base=(x.p+' '+(o.summary||'')+' '+(o.description||'')+' '+x.tag).toLowerCase();});
var schemaProps={};Object.keys(C).forEach(function(k){var s=C[k],l=[];if(s.properties)l=Object.keys(s.properties);if(s['x-enumNames'])l=l.concat(s['x-enumNames']);schemaProps[k]=l;});
function opHit(x){if(!q)return {ok:true};if(x.base.indexOf(q)>-1)return {ok:true};for(var i=0;i<x.terms.length;i++){var tt=x.terms[i];if(tt.n.toLowerCase().indexOf(q)>-1)return {ok:true,hit:tt.k+': '+tt.n};}for(var j=0;j<x.terms.length;j++){var t2=x.terms[j];if(t2.d&&t2.d.toLowerCase().indexOf(q)>-1)return {ok:true,hit:t2.k+': '+t2.n};}return {ok:false};}
function schemaHit(k){if(k.toLowerCase().indexOf(q)>-1)return {ok:true};var l=schemaProps[k];for(var i=0;i<l.length;i++)if(String(l[i]).toLowerCase().indexOf(q)>-1)return {ok:true,hit:'field: '+l[i]};return {ok:false};}
function nav(){var h='',last=null,list=[];
 ops.forEach(function(x){var r=opHit(x);if(r.ok)list.push({x:x,hit:r.hit});});
 list.sort(function(a,b){return a.x.tag.localeCompare(b.x.tag)||a.x.p.localeCompare(b.x.p);});
 list.forEach(function(it){var x=it.x;if(x.tag!==last){h+='<div class="tag">'+e(x.tag)+'</div>';last=x.tag;}h+='<button class="op" data-id="'+e(x.id)+'"'+(cur===x.id?' aria-current="true"':'')+'><span class="m '+x.m+'">'+x.m+'</span><span class="opt"><code>'+e(x.p.replace('/api/v2/ci',''))+'</code>'+(it.hit?'<span class="hit">'+e(it.hit)+'</span>':'')+'</span></button>';});
 var sh=[];if(q){Object.keys(C).forEach(function(k){if(sh.length>=60)return;var r=schemaHit(k);if(r.ok)sh.push({k:k,hit:r.hit});});}
 if(sh.length){h+='<div class="tag">Schemas</div>'+sh.map(function(it){return '<button class="op" data-sc="'+e(it.k)+'"><span class="opt"><code>'+e(it.k.split('.').pop())+'</code>'+(it.hit?'<span class="hit">'+e(it.hit)+'</span>':'')+'</span></button>';}).join('');}
 var cnt=q?'<p class="count">'+list.length+' operation'+(list.length===1?'':'s')+(sh.length?' and '+sh.length+(sh.length>=60?'+':'')+' schema'+(sh.length===1?'':'s'):'')+' match</p>':'';
 document.getElementById('nav').innerHTML=(list.length||sh.length)?cnt+h:'<p class="empty">No matches.</p>';}
function showOp(id){cur=id;var x=ops.filter(function(o){return o.id===id;})[0],o=x.o,h='<div class="path"><span class="m '+x.m+'">'+x.m+'</span>'+e(x.p)+'</div><h2 style="margin-top:12px">'+e(o.summary||'')+'</h2>';
 if(o.description)h+='<p class="muted">'+e(o.description)+'</p>';
 if(o.parameters&&o.parameters.length){h+='<h3>Parameters</h3><table><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th><th>Description</th></tr>'+o.parameters.map(function(p){return'<tr><td><code>'+e(p.name)+'</code></td><td>'+e(p.in)+'</td><td>'+typeOf(p.schema)+'</td><td>'+(p.required?'Yes':'')+'</td><td>'+e(p.description||'')+'</td></tr>';}).join('')+'</table>';}
 var b=body(o.requestBody);if(b)h+='<h3>Request body</h3><p>'+b+'</p>';
 if(o.responses){h+='<h3>Responses</h3><table><tr><th>Code</th><th>Description</th><th>Schema</th></tr>'+Object.keys(o.responses).map(function(c){var r=o.responses[c];return'<tr><td><code>'+c+'</code></td><td>'+e(r.description)+'</td><td>'+body(r)+'</td></tr>';}).join('')+'</table>';}
 document.getElementById('main').innerHTML=BACK+h;nav();document.getElementById('main').scrollTop=0;toMain();}
function showSchema(k){var s=C[k];if(!s)return;var h='<p class="muted" style="margin:0">Schema</p><h2>'+e(k.split('.').pop())+'</h2><p class="muted" style="font-family:var(--mono);font-size:12px">'+e(k)+'</p>';
 if(s.description)h+='<p>'+e(s.description)+'</p>';
 if(s.enum){var names=s['x-enumNames']||[];h+='<h3>Values</h3><table><tr><th>Value</th><th>Name</th></tr>'+s.enum.map(function(v,i){return'<tr><td><code>'+v+'</code></td><td>'+e(names[i]||'')+'</td></tr>';}).join('')+'</table>';}
 if(s.properties){var req=s.required||[];h+='<h3>Properties</h3><table><tr><th>Name</th><th>Type</th><th>Required</th><th>Notes</th></tr>'+Object.keys(s.properties).map(function(n){var p=s.properties[n],nt=[];if(p.nullable)nt.push('nullable');if(p.readOnly)nt.push('read-only');if(p.maxLength!=null)nt.push('max '+p.maxLength);if(p.description)nt.push(e(p.description));return'<tr><td><code>'+e(n)+'</code></td><td>'+typeOf(p)+'</td><td>'+(req.indexOf(n)>-1?'Yes':'')+'</td><td>'+nt.join(' · ')+'</td></tr>';}).join('')+'</table>';}
 h+='<h3>Raw JSON</h3><pre>'+e(JSON.stringify(s,null,2))+'</pre>';
 document.getElementById('main').innerHTML=BACK+h;document.getElementById('main').scrollTop=0;toMain();}
document.getElementById('nav').addEventListener('click',function(ev){var b=ev.target.closest('.op');if(!b)return;if(b.dataset.id)showOp(b.dataset.id);else showSchema(b.dataset.sc);});
document.getElementById('main').addEventListener('click',function(ev){if(ev.target.closest('.back')){document.getElementById('q').scrollIntoView({block:'start'});return;}var b=ev.target.closest('.ref');if(b)showSchema(b.dataset.s);});
document.getElementById('q').addEventListener('input',function(ev){q=ev.target.value.trim().toLowerCase();nav();});
var root=document.documentElement;try{var t=localStorage.getItem('swag-theme');if(t)root.setAttribute('data-theme',t);}catch(x){}
document.getElementById('theme').addEventListener('click',function(){var c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('swag-theme',n);}catch(x){}});
nav();showOp(ops.filter(function(o){return o.p==='/api/v2/ci/processes'&&o.m==='POST';})[0].id);started=true;
})();
</script></body></html>
